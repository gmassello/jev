<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Playground</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f7f7f8; --card: #ffffff; --text: #1a1a1a; --muted: #666666; --line: #dddddd; --border-strong: #858585;
    --accent: #2a62d9; --accent-soft: #2a62d922; --on-accent: #ffffff; --ring: #2a62d9;
    --ok: #157a40; --ok-soft: #157a4015; --bad: #c62828; --bad-soft: #c6282815; --warn: #ab570a; --warn-soft: #ab570a15;
    --code-bg: #101010; --code-fg: #f5f6f7;
    --font-sans: system-ui, sans-serif; --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --fs-h1: 1.6rem; --fs-title: 1.5rem; --fs-verdict: 1.4rem; --fs-body: 1rem; --fs-sm: .9rem; --fs-xs: .8rem; --fs-code: 13px;
    --radius-sm: 6px; --radius-md: 10px; --radius-pill: 99px;
    --dur-fast: 150ms;
    font-family: var(--font-sans);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { background: var(--bg); color: var(--text); max-width: 820px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  h1 { margin: 0; font-size: var(--fs-h1); }
  h2 { font-size: 1.1rem; margin: 1.8rem 0 .6rem; }
  h2 small { color: var(--muted); font-weight: 400; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-md); padding: 1rem; margin-bottom: .8rem; }
  textarea, input, select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .5rem; }
  textarea, input.q-text { width: 100%; }
  textarea { resize: vertical; min-height: 5rem; }
  button { font: inherit; cursor: pointer; border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--card); color: inherit; padding: .4rem .8rem; }
  button:hover { border-color: var(--accent); }
  .table-wrap { overflow-x: auto; margin: 0 0 1rem; }
  table { border-collapse: collapse; width: 100%; font-size: var(--fs-sm); background: var(--card); }
  th, td { text-align: left; padding: .5rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  td:first-child { font-weight: 600; min-width: 9rem; }
  td a { color: var(--accent); }
  .multi-q { margin: 0; font-weight: 600; }
  .outro { font-weight: 600; }
  .explain.review { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
  .type-badge { display: inline-block; font-size: var(--fs-xs); font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: var(--radius-pill); padding: .15rem .6rem; margin-bottom: .6rem; }
  .explain { background: var(--accent-soft); border-radius: var(--radius-sm); padding: .6rem .8rem; margin: .8rem 0 0; line-height: 1.5; }
  .stepper { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: var(--fs-sm); margin: 1.2rem 0 0; }
  #dots { display: flex; gap: .35rem; }
  #dots button { width: .6rem; height: .6rem; padding: 0; border: 0; border-radius: var(--radius-pill); background: var(--line); }
  #dots button.on { background: var(--accent); }
  #dots button:hover { background: var(--accent); opacity: .7; }
  .lesson-title { font-size: var(--fs-title); margin: .4rem 0 .8rem; }
  .theory p { line-height: 1.6; margin: 0 0 .7rem; }
  #view-playground h3 { font-size: .95rem; margin: 1.4rem 0 .4rem; }
  .opt.described { display: grid; grid-template-columns: minmax(6rem, 30%) 1fr auto; }
  .step-nav { display: flex; justify-content: space-between; gap: .8rem; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--line); }
  .step-nav.top { margin: 1rem 0 0; padding: 0 0 1rem; border-top: 0; border-bottom: 1px solid var(--line); }
  .nav-next { margin-left: auto; }
  #json { margin-top: 1rem; }
  #json summary { color: var(--accent); }
  .code { position: relative; margin: 0 0 1rem; }
  .code button { position: absolute; top: .5rem; right: .5rem; font-size: var(--fs-xs); padding: .2rem .6rem; }
  .commands { padding-left: 1.4rem; line-height: 1.9; }
  .commands code { font-family: var(--font-mono); background: var(--accent-soft); padding: .1rem .4rem; border-radius: 4px; }
  .code pre, #json pre { background: var(--code-bg); color: var(--code-fg); border-color: var(--code-bg); font-size: var(--fs-code); white-space: pre-wrap; overflow-wrap: anywhere; }
  .opts { display: grid; gap: .4rem; margin-top: .4rem; }
  .opt { display: flex; gap: .4rem; align-items: center; }
  .opt input { flex: 1; }
  .opt .idx { color: var(--muted); min-width: 1.5rem; text-align: right; font-size: .85rem; }
  .hint { color: var(--muted); font-size: .85rem; margin: .3rem 0 0; }
  .error { color: var(--bad); font-size: var(--fs-sm); margin: .4rem 0 0; }
  .link { border: 0; background: none; color: var(--accent); padding: .2rem 0; }
  .x { border: 0; background: none; color: var(--muted); font-size: 1.1rem; padding: 0 .4rem; }
  .x:hover { color: var(--bad); }
  #run { display: block; width: 100%; margin-top: 1.2rem; padding: .8rem; font-size: 1.1rem; font-weight: 600; background: var(--accent); color: var(--on-accent); border: 0; }
  #run:disabled { opacity: .6; cursor: wait; }
  .answer h3 { margin: 0 0 .3rem; font-size: var(--fs-body); }
  .verdict { font-size: var(--fs-verdict); font-weight: 700; margin: .2rem 0 .6rem; }
  .verdict.yes { color: var(--ok); } .verdict.no { color: var(--bad); }
  .bar-row { display: grid; grid-template-columns: minmax(6rem, 30%) 1fr 3.2rem; gap: .5rem; align-items: center; margin: .25rem 0; font-size: var(--fs-sm); }
  .bar { height: .7rem; background: var(--accent-soft); border-radius: var(--radius-pill); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: var(--radius-pill); }
  .bar-row.win { font-weight: 700; }
  .pct { text-align: right; font-variant-numeric: tabular-nums; }
  .footer { color: var(--muted); font-size: var(--fs-xs); font-variant-numeric: tabular-nums; margin: .8rem 0 0; }
  .fail { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  details { margin-top: 2rem; }
  summary { cursor: pointer; color: var(--muted); }
  pre { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: .75rem; overflow: auto; font: 12px/1.4 var(--font-mono); }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <h1>Jev Playground</h1>
  <select id="lang" aria-label="Idioma / Language">
    <option value="es">Español</option>
    <option value="en">English</option>
  </select>
</header>
<main id="view-playground">
<div class="step-nav top">
  <button class="nav-prev" type="button"></button>
  <button class="nav-home" type="button"></button>
  <button class="nav-next" type="button"></button>
</div>
<div class="stepper"><span id="step-of"></span><nav id="dots" aria-label="Steps"></nav></div>
<h2 id="lesson-title" class="lesson-title"></h2>
<div id="theory" class="theory"></div>

<div id="ask">
  <h3 data-i18n="step1"></h3>
  <textarea id="state" rows="3"></textarea>
  <h3 data-i18n="step2"></h3>
  <div id="questions"></div>
  <button id="run" data-i18n="run"></button>
  <h3 id="results-title" data-i18n="step3" hidden></h3>
  <div id="results"></div>
  <details id="json" hidden>
    <summary data-i18n="jsonToggle"></summary>
    <h3 data-i18n="jsonRequest"></h3>
    <pre id="req"></pre>
    <h3 data-i18n="jsonResponse"></h3>
    <pre id="res"></pre>
  </details>
</div>

<div class="step-nav">
  <button class="nav-prev" type="button"></button>
  <button class="nav-home" type="button"></button>
  <button class="nav-next" type="button"></button>
</div>
</main>

<script type="module">
  import { I18N, resolve, keyOrCredit } from './copy.js';

  const $ = (id) => document.getElementById(id);
  const h = (tag, props = {}, ...kids) => {
    const el = Object.assign(document.createElement(tag), props);
    el.append(...kids.flat(Infinity).filter((k) => k != null));
    return el;
  };

  let lang = 'es';
  let step = 0;
  let byStep = {};
  let runs = {};
  let lastRun = null;
  const t = () => resolve(lang);
  const lessons = () => t().lessons;
  const lesson = () => lessons()[step];
  const entryAt = (i) => (byStep[i] ??= { state: lessons()[i].state, question: structuredClone(lessons()[i].question ?? null) });
  const isMulti = () => lesson().kind === 'multi';
  const entry = () => entryAt(step);
  const current = () => entry().question;

  const renderQuestions = (error) => {
    if (isMulti()) {
      return $('questions').replaceChildren(...lesson().questions.map((q) => h('div', { className: 'card' },
        h('span', { className: 'type-badge', textContent: t().types[q.type] }),
        h('p', { className: 'multi-q', textContent: q.text }),
        q.options.length ? h('p', { className: 'hint', textContent: q.options.join(' · ') }) : null)));
    }
    const q = current();
    const described = Boolean(q.descriptions);
    const opts = q.type === 'boolean' ? null : h('div', { className: 'opts' },
      q.options.map((o, j) => h('div', { className: `opt${described ? ' described' : ''}` },
        q.type === 'score' ? h('span', { className: 'idx', textContent: j + 1 }) : null,
        h('input', { value: o, ariaLabel: `${t().optionPlaceholder} ${j + 1}`, placeholder: q.type === 'score' ? `${t().levelPlaceholder} ${j + 1}` : `${t().optionPlaceholder} ${j + 1}`, oninput: (e) => { q.options[j] = e.target.value; } }),
        described ? h('input', { value: q.descriptions[j] ?? '', ariaLabel: `${t().descriptionPlaceholder} ${j + 1}`, placeholder: t().descriptionPlaceholder, oninput: (e) => { q.descriptions[j] = e.target.value; } }) : null,
        q.options.length > 2 ? h('button', { className: 'x', title: t().remove, textContent: '×', onclick: () => { q.options.splice(j, 1); q.descriptions?.splice(j, 1); renderQuestions(); } }) : null,
      )),
      h('button', { className: 'link', textContent: q.type === 'score' ? t().addLevel : t().addOption, onclick: () => { q.options.push(''); q.descriptions?.push(''); renderQuestions(); } }),
    );
    $('questions').replaceChildren(h('div', { className: 'card' },
      h('span', { className: 'type-badge', textContent: t().types[q.type] }),
      h('input', { className: 'q-text', value: q.text, placeholder: t().questionPlaceholder, ariaLabel: t().questionPlaceholder, oninput: (e) => { q.text = e.target.value; } }),
      h('p', { className: 'hint', textContent: t().hints[q.type] }),
      opts,
      error ? h('p', { className: 'error', textContent: error }) : null,
    ));
  };

  const toQuestion = (q) => {
    const base = { type: q.type, instructions: q.text.trim() };
    const pairs = q.options.map((o, i) => [o.trim(), q.descriptions?.[i]?.trim() || null]).filter(([o]) => o);
    if (q.type === 'choice') base.criteria = Object.fromEntries(pairs);
    if (q.type === 'score') base.criteria = pairs.map(([o]) => o);
    return base;
  };

  const toRequest = () => ({
    state: entry().state.trim(),
    questions: isMulti() ? Object.fromEntries(lesson().questions.map((q) => [q.id, toQuestion(q)])) : { q1: toQuestion(current()) },
  });

  const validate = () => {
    if (isMulti()) return null;
    const q = current();
    if (!q.text.trim()) return t().errNoText;
    if (q.type !== 'boolean' && q.options.filter((o) => o.trim()).length < 2) return t().errOptions;
    return null;
  };

  const renderStep = () => {
    const L = lesson();
    const total = lessons().length;
    $('step-of').textContent = t().stepOf(step + 1, total);
    $('dots').ariaLabel = t().stepsNav;
    $('dots').replaceChildren(...lessons().map((l, i) => h('button', { type: 'button', className: i <= step ? 'on' : '', title: l.title, ariaLabel: `${i + 1}. ${l.title}`, ariaCurrent: i === step ? 'step' : null, onclick: () => go(i) })));
    $('lesson-title').textContent = L.title;
    $('theory').replaceChildren(
      ...L.theory.map((p) => h('p', { textContent: p })),
      ...(L.table ? [h('div', { className: 'table-wrap' }, h('table', {},
        h('thead', {}, h('tr', {}, L.table.head.map((c) => h('th', { textContent: c })))),
        h('tbody', {}, L.table.rows.map(([name, url, ...cells]) => h('tr', {},
          h('td', {}, url ? h('a', { href: url, target: '_blank', rel: 'noopener', textContent: name }) : name),
          cells.map((c) => h('td', { textContent: c })))))))] : []),
      ...(L.diagram ? [h('div', { className: 'code' }, h('pre', { textContent: L.diagram }))] : []),
      ...(L.list ? [h('ul', {}, L.list.map((c) => h('li', { textContent: c })))] : []),
      ...(L.commands ? [h('ol', { className: 'commands' }, L.commands.map((c) => h('li', {}, h('code', { textContent: c }))))] : []),
      ...(L.code ? [h('div', { className: 'code' },
        h('button', { type: 'button', textContent: t().copy, onclick: async (e) => {
          try { await navigator.clipboard.writeText(L.code); e.target.textContent = t().copied; setTimeout(() => (e.target.textContent = t().copy), 1500); } catch {}
        } }),
        h('pre', { textContent: L.code }))] : []),
      ...(L.outro ? [h('p', { className: 'explain', textContent: L.outro })] : []),
    );
    const asks = L.kind === 'ask' || L.kind === 'multi';
    $('ask').hidden = !asks;
    if (asks) {
      $('state').value = entry().state;
      lastRun = runs[step] ?? null;
      renderQuestions();
      renderResults();
    }
    const nav = (cls, text, hidden) => document.querySelectorAll(cls).forEach((b) => { b.textContent = text; b.hidden = hidden; });
    nav('.nav-prev', t().prev, step === 0);
    nav('.nav-home', t().home, step === 0);
    nav('.nav-next', step === 0 ? t().start : t().next, step === total - 1);
    try { localStorage.setItem('step', String(step)); } catch {}
  };

  const go = (i) => { step = i; renderStep(); scrollTo(0, 0); };

  const pct = (p) => Math.round(p * 100);
  const bar = (label, p, win) => h('div', { className: `bar-row${win ? ' win' : ''}` },
    h('span', { textContent: label }),
    h('div', { className: 'bar' }, h('i', { style: `width:${pct(p)}%` })),
    h('span', { className: 'pct', textContent: `${pct(p)}%` }));

  const renderAnswer = (q, a) => {
    if (a.type === 'boolean') {
      const yes = a.probability >= 0.5;
      return [
        h('p', { className: `verdict ${yes ? 'yes' : 'no'}`, textContent: `${yes ? t().yes : t().no} · ${t().sure(pct(yes ? a.probability : 1 - a.probability))}` }),
        bar(t().yes, a.probability, yes),
        bar(t().no, 1 - a.probability, !yes),
      ];
    }
    if (a.type === 'choice') {
      const probs = Object.entries(a.probabilities ?? { [a.choice]: 1 }).sort((x, y) => y[1] - x[1]);
      return [h('p', { className: 'verdict', textContent: a.choice }), probs.map(([k, p]) => bar(k, p, k === a.choice))];
    }
    const levels = q.criteria;
    const nearest = Math.min(levels.length - 1, Math.max(0, Math.round(a.score)));
    return [
      h('p', { className: 'verdict', textContent: `${levels[nearest]} · ${nearest + 1}/${levels.length}` }),
      levels.map((name, j) => bar(name, a.probabilities?.[j] ?? (j === nearest ? 1 : 0), j === nearest)),
    ];
  };

  const explainFor = (q, a) => {
    if (a.type === 'boolean') {
      const yes = a.probability >= 0.5;
      return t().explain.boolean(yes, pct(yes ? a.probability : 1 - a.probability));
    }
    if (a.type === 'choice') return t().explain.choice(a.choice, pct(a.probabilities?.[a.choice] ?? 1));
    const nearest = Math.min(q.criteria.length - 1, Math.max(0, Math.round(a.score)));
    return t().explain.score(q.criteria[nearest], nearest + 1, q.criteria.length);
  };

  const probabilityOf = (q, a) => {
    if (a.type === 'boolean') return Math.max(a.probability, 1 - a.probability);
    if (a.type === 'choice') return a.probabilities?.[a.choice] ?? 1;
    const nearest = Math.min(q.criteria.length - 1, Math.max(0, Math.round(a.score)));
    return a.probabilities?.[nearest] ?? 1;
  };

  const thresholdLine = (q, a) => {
    const limit = lesson().threshold;
    if (!limit) return null;
    const p = probabilityOf(q, a);
    return h('p', { className: `explain${p >= limit ? '' : ' review'}`, textContent: t().thresholdNote(pct(p), p >= limit, pct(limit)) });
  };

  const confidenceLine = (c) => (typeof c === 'number' ? h('p', { className: 'explain', textContent: t().confidenceNote(pct(c)) }) : null);

  const renderResults = () => {
    $('results-title').hidden = !lastRun;
    $('json').hidden = !lastRun || Boolean(lastRun.res.local);
    $('req').textContent = lastRun ? JSON.stringify(lastRun.req, null, 2) : '';
    $('res').textContent = lastRun ? JSON.stringify(lastRun.res, null, 2) : '';
    if (!lastRun) return $('results').replaceChildren();
    const { req, res } = lastRun;
    if (res.error) {
      if (!res.local && keyOrCredit(res.error)) {
        return $('results').replaceChildren(h('div', { className: 'card fail' }, h('strong', { textContent: t().errKey }), h('p', { textContent: t().errKeyFix })));
      }
      return $('results').replaceChildren(h('div', { className: 'card fail' }, res.local ? null : h('strong', { textContent: t().errServer }), h('p', { textContent: res.error })));
    }
    $('results').replaceChildren(
      ...Object.entries(req.questions).map(([id, q]) => h('div', { className: 'card answer' },
        h('h3', { textContent: q.instructions }),
        res.answers?.[id] ? [renderAnswer(q, res.answers[id]), h('p', { className: 'explain', textContent: explainFor(q, res.answers[id]) }), thresholdLine(q, res.answers[id]), confidenceLine(res.confidence?.[id])] : null)),
      ...(isMulti() ? [h('p', { className: 'explain outro', textContent: t().multiOutro })] : []),
      ...(res.usage ? [h('p', { className: 'footer', textContent: t().footer({ tokens: res.usage.totalTokens, cost: res.cost ?? null, modelId: res.modelId, ms: res.ms }) })] : []),
    );
  };

  const setLang = (next) => {
    lang = next;
    document.documentElement.lang = lang;
    $('lang').value = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => (el.textContent = t()[el.dataset.i18n]));
    $('state').placeholder = t().statePlaceholder;
    byStep = {};
    runs = {};
    renderStep();
    try { localStorage.setItem('lang', lang); } catch {}
  };

  $('state').oninput = (e) => { entry().state = e.target.value; };
  document.querySelectorAll('.nav-prev').forEach((b) => (b.onclick = () => go(step - 1)));
  document.querySelectorAll('.nav-home').forEach((b) => (b.onclick = () => go(0)));
  document.querySelectorAll('.nav-next').forEach((b) => (b.onclick = () => go(step + 1)));
  $('lang').onchange = (e) => setLang(e.target.value);

  $('run').onclick = async () => {
    const req = toRequest();
    const error = validate();
    if (!req.state || error) {
      renderQuestions(error);
      lastRun = runs[step] = { req, res: { local: true, error: !req.state ? t().errNoState : error } };
      return renderResults();
    }
    renderQuestions();
    $('run').disabled = true;
    $('run').textContent = t().running;
    try {
      const r = await fetch('/evaluate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(req) });
      lastRun = runs[step] = { req, res: await r.json() };
    } catch (error) {
      lastRun = runs[step] = { req, res: { error: error.message } };
    }
    $('run').disabled = false;
    $('run').textContent = t().run;
    renderResults();
    $('results-title').scrollIntoView({ behavior: 'smooth' });
  };

  let saved = null;
  try { saved = localStorage.getItem('lang'); step = Math.max(0, Number(localStorage.getItem('step')) || 0); } catch {}
  step = Math.min(step, I18N.en.lessons.length - 1);
  setLang(I18N[saved] ? saved : navigator.language.startsWith('es') ? 'es' : 'en');
</script>
</body>
</html>
