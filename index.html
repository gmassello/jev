<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Playground</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f8; --card: #ffffff; --text: #1a1a1a; --muted: #666666; --line: #dddddd; --border-strong: #858585;
    --accent: #2a62d9; --accent-soft: #2a62d922; --on-accent: #ffffff; --ring: #2a62d9;
    --ok: #157a40; --ok-soft: #157a4015; --bad: #c62828; --bad-soft: #c6282815; --warn: #ab570a; --warn-soft: #ab570a15;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --dur-fast: 150ms; --dur-count: 700ms;
    font-family: system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #151517; --card: #202024; --text: #eeeeee; --muted: #999999; --line: #333333; --border-strong: #707070; --accent: #6b9bff; --accent-soft: #6b9bff26; --on-accent: #0b1020; --ring: #6b9bff; --ok: #4cc27f; --ok-soft: #4cc27f1f; --bad: #ff6b6b; --bad-soft: #ff6b6b1a; --warn: #f5a623; --warn-soft: #f5a6231f; }
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); max-width: 820px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  h1 { margin: 0; font-size: 1.6rem; }
  .intro { color: var(--muted); margin: .4rem 0 1.5rem; }
  h2 { font-size: 1.1rem; margin: 1.8rem 0 .6rem; }
  h2 small { color: var(--muted); font-weight: 400; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 1rem; margin-bottom: .8rem; }
  textarea, input, select { font: inherit; color: inherit; background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: .5rem; }
  textarea, input.q-text { width: 100%; }
  textarea { resize: vertical; min-height: 5rem; }
  button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: inherit; padding: .4rem .8rem; }
  button:hover { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .6rem; align-items: center; }
  .chips span { color: var(--muted); }
  .q-head { display: flex; gap: .5rem; align-items: center; margin-bottom: .6rem; }
  .q-head .num { font-weight: 700; color: var(--accent); }
  .q-head select { margin-left: auto; }
  .opts { display: grid; gap: .4rem; margin-top: .4rem; }
  .opt { display: flex; gap: .4rem; align-items: center; }
  .opt input { flex: 1; }
  .opt .idx { color: var(--muted); min-width: 1.5rem; text-align: right; font-size: .85rem; }
  .hint { color: var(--muted); font-size: .85rem; margin: .3rem 0 0; }
  .error { color: var(--bad); font-size: .9rem; margin: .4rem 0 0; }
  .link { border: 0; background: none; color: var(--accent); padding: .2rem 0; }
  .x { border: 0; background: none; color: var(--muted); font-size: 1.1rem; padding: 0 .4rem; }
  .x:hover { color: var(--bad); }
  #run { display: block; width: 100%; margin-top: 1.2rem; padding: .8rem; font-size: 1.1rem; font-weight: 600; background: var(--accent); color: var(--on-accent); border: 0; }
  #run:disabled { opacity: .6; cursor: wait; }
  .answer h3 { margin: 0 0 .3rem; font-size: 1rem; }
  .verdict { font-size: 1.4rem; font-weight: 700; margin: .2rem 0 .6rem; }
  .verdict.yes { color: var(--ok); } .verdict.no { color: var(--bad); }
  .bar-row { display: grid; grid-template-columns: minmax(6rem, 30%) 1fr 3.2rem; gap: .5rem; align-items: center; margin: .25rem 0; font-size: .9rem; }
  .bar { height: .7rem; background: var(--accent-soft); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
  .bar-row.win { font-weight: 700; }
  .pct { text-align: right; font-variant-numeric: tabular-nums; }
  .fail { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
  .meta { color: var(--muted); font-size: .85rem; }
  details { margin-top: 2rem; }
  summary { cursor: pointer; color: var(--muted); }
  pre { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: .75rem; overflow: auto; font: 12px/1.4 ui-monospace, monospace; }
  .tabs { display: flex; gap: .3rem; border-bottom: 1px solid var(--line); margin: 1rem 0 0; }
  .tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: .5rem 1rem; color: var(--muted); font-weight: 600; }
  .tabs button[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .toc { display: flex; flex-wrap: wrap; gap: .4rem .8rem; font-size: .9rem; margin-bottom: 1rem; }
  .toc a { color: var(--accent); text-decoration: none; }
  .toc a:hover { text-decoration: underline; }
  .doc { margin: 0 0 .8rem; padding: 0; scroll-margin-top: 1rem; }
  .doc summary { color: var(--text); font-weight: 700; font-size: 1.05rem; padding: 1rem; }
  .doc .doc-body { padding: 0 1rem 1rem; }
  .doc p, .doc li { line-height: 1.55; }
  .doc p { margin: 0 0 .7rem; }
  .doc ul { margin: 0 0 .7rem; padding-left: 1.2rem; }
  .doc li { margin-bottom: .35rem; }
  .table-wrap { overflow-x: auto; margin: 0 0 .7rem; }
  table { border-collapse: collapse; width: 100%; font-size: .9rem; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .code { position: relative; }
  .code pre { margin: 0 0 .7rem; padding-top: 2.2rem; }
  .code button { position: absolute; top: .4rem; right: .4rem; font-size: .8rem; padding: .2rem .6rem; }
  .cta { display: block; margin: 1.2rem auto 0; padding: .7rem 1.4rem; font-weight: 600; background: var(--accent); color: var(--on-accent); border: 0; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
  .field { display: grid; gap: .3rem; margin-bottom: .8rem; }
  .field label { font-size: .9rem; font-weight: 600; }
  .field select, .field input { width: 100%; border-color: var(--border-strong); }
  .primary { display: block; width: 100%; padding: .8rem; font-size: 1.1rem; font-weight: 600; background: var(--accent); color: var(--on-accent); border: 0; }
  .primary:disabled { opacity: .5; cursor: not-allowed; }
  .primary[aria-busy="true"] { opacity: .75; cursor: wait; }
  .scoreboard { display: flex; align-items: baseline; gap: .6rem; flex-wrap: wrap; margin: 1.2rem 0 .4rem; }
  .score { font: 700 4.5rem/1.1 var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  .score-label { font-size: 1.25rem; color: var(--muted); }
  .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
  .tickets td:first-child { min-width: 14rem; }
  .tickets .tid { font: 600 .75rem var(--font-mono); color: var(--muted); display: block; }
  .tickets tr.fail td { background: var(--bad-soft); }
  .tickets td.pending { color: var(--muted); }
  .tickets td.arrived { animation: arrive var(--dur-fast) ease-out; }
  @keyframes arrive { from { opacity: 0; } to { opacity: 1; } }
  .badge { display: inline-block; border-radius: 9999px; font-size: .75rem; font-weight: 600; padding: .15rem .5rem; white-space: nowrap; }
  .badge.ok { color: var(--ok); background: var(--ok-soft); }
  .badge.bad { color: var(--bad); background: var(--bad-soft); }
  .badge.warn { color: var(--warn); background: var(--warn-soft); }
  .threshold { margin: .8rem 0 1rem; }
  .threshold .slider { display: flex; align-items: center; gap: .8rem; }
  .threshold input[type="range"] { flex: 1; accent-color: var(--accent); }
  .threshold .value { font: 700 1.25rem var(--font-mono); min-width: 3.5rem; text-align: right; }
  .counters { display: grid; grid-template-columns: repeat(3, 1fr); gap: .6rem; margin-top: .8rem; }
  .counter { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .8rem; }
  .counter b { display: block; font: 700 2rem/1.1 var(--font-mono); font-variant-numeric: tabular-nums; }
  .counter span { font-size: .85rem; color: var(--muted); }
  .counter.auto b { color: var(--ok); } .counter.review b { color: var(--warn); } .counter.wrong b { color: var(--bad); }
  @media (max-width: 520px) { .counters { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .tickets td.arrived { animation: none; } }
  @media (max-width: 520px) { .q-head { flex-wrap: wrap; } .q-head select { margin-left: 0; width: 100%; } }
</style>
</head>
<body>
<header>
  <h1>Jev Playground</h1>
  <select id="lang" aria-label="Idioma / Language">
    <option value="es">Español</option>
    <option value="en">English</option>
  </select>
</header>
<nav class="tabs" role="tablist">
  <button role="tab" id="tab-challenge" data-tab="challenge" data-i18n="tabChallenge"></button>
  <button role="tab" id="tab-playground" data-tab="playground" data-i18n="tabPlayground"></button>
  <button role="tab" id="tab-docs" data-tab="docs" data-i18n="tabDocs"></button>
</nav>

<main id="view-challenge" hidden></main>

<main id="view-playground" hidden>
<p class="intro" data-i18n="intro"></p>

<h2 data-i18n="step1"></h2>
<div class="chips" id="examples"></div>
<textarea id="state" rows="4"></textarea>

<h2 data-i18n="step2"></h2>
<div id="questions"></div>
<button class="link" id="add-q" data-i18n="addQuestion"></button>

<button id="run" data-i18n="run"></button>

<h2 id="results-title" data-i18n="step3" hidden></h2>
<div id="results"></div>

<details id="advanced">
  <summary data-i18n="advanced"></summary>
  <p class="hint" data-i18n="advancedHint"></p>
  <pre id="req"></pre>
  <pre id="res"></pre>
</details>
</main>

<main id="view-docs" hidden></main>

<script type="module">
  import { I18N, resolve, docsFor } from './copy.js';
  import { QUESTIONS, LEVELS, TICKETS } from './challenge/tickets.js';
  import { judge, summarize, canRun, bucket } from './challenge/score.js';
  import { pool } from './challenge/pool.js';

  const $ = (id) => document.getElementById(id);
  const h = (tag, props = {}, ...kids) => {
    const el = Object.assign(document.createElement(tag), props);
    el.append(...kids.flat(Infinity).filter((k) => k != null));
    return el;
  };

  let lang = 'es';
  let preset = 'support';
  let dirty = false;
  let questions = [];
  let lastRun = null;
  const t = () => resolve(lang);
  const blank = (type = 'boolean') => ({ text: '', type, options: type === 'boolean' ? [] : ['', ''] });

  const loadPreset = (key) => {
    preset = key;
    dirty = false;
    const p = t().presets[key];
    $('state').value = p.state;
    questions = structuredClone(p.questions);
    lastRun = null;
    renderQuestions();
    renderResults();
  };

  const touch = () => { dirty = true; preset = null; };

  const renderExamples = () => {
    $('examples').replaceChildren(
      h('span', { textContent: t().examples }),
      ...Object.entries(t().presets).map(([key, p]) => h('button', { textContent: p.label, onclick: () => loadPreset(key) })),
    );
  };

  const renderQuestions = (errors = {}) => {
    $('questions').replaceChildren(...questions.map((q, i) => {
      const typeSel = h('select', { onchange: (e) => { touch(); const next = e.target.value; q.type = next; if (next !== 'boolean' && q.options.length < 2) q.options = ['', '']; renderQuestions(); } },
        Object.entries(t().types).map(([v, label]) => h('option', { value: v, textContent: label, selected: q.type === v })));
      const opts = q.type === 'boolean' ? null : h('div', { className: 'opts' },
        q.options.map((o, j) => h('div', { className: 'opt' },
          q.type === 'score' ? h('span', { className: 'idx', textContent: j + 1 }) : null,
          h('input', { value: o, placeholder: q.type === 'score' ? `${t().levelPlaceholder} ${j + 1}` : `${t().optionPlaceholder} ${j + 1}`, oninput: (e) => { touch(); q.options[j] = e.target.value; } }),
          q.options.length > 2 ? h('button', { className: 'x', title: t().remove, textContent: '×', onclick: () => { touch(); q.options.splice(j, 1); renderQuestions(); } }) : null,
        )),
        h('button', { className: 'link', textContent: q.type === 'score' ? t().addLevel : t().addOption, onclick: () => { touch(); q.options.push(''); renderQuestions(); } }),
      );
      return h('div', { className: 'card' },
        h('div', { className: 'q-head' },
          h('span', { className: 'num', textContent: `#${i + 1}` }),
          typeSel,
          questions.length > 1 ? h('button', { className: 'x', title: t().remove, textContent: '×', onclick: () => { touch(); questions.splice(i, 1); renderQuestions(); } }) : null,
        ),
        h('input', { className: 'q-text', value: q.text, placeholder: t().questionPlaceholder, oninput: (e) => { touch(); q.text = e.target.value; } }),
        h('p', { className: 'hint', textContent: t().hints[q.type] }),
        opts,
        errors[i] ? h('p', { className: 'error', textContent: errors[i] }) : null,
      );
    }));
  };

  const toRequest = () => ({
    state: $('state').value.trim(),
    questions: Object.fromEntries(questions.map((q, i) => {
      const options = q.options.map((o) => o.trim()).filter(Boolean);
      const base = { type: q.type, instructions: q.text.trim() };
      if (q.type === 'choice') base.criteria = Object.fromEntries(options.map((o) => [o, null]));
      if (q.type === 'score') base.criteria = options;
      return [`q${i + 1}`, base];
    })),
  });

  const validate = () => {
    const errors = {};
    questions.forEach((q, i) => {
      if (!q.text.trim()) errors[i] = t().errNoText;
      else if (q.type !== 'boolean' && q.options.filter((o) => o.trim()).length < 2) errors[i] = t().errOptions;
    });
    return errors;
  };

  const pct = (p) => Math.round(p * 100);
  const bar = (label, p, win) => h('div', { className: `bar-row${win ? ' win' : ''}` },
    h('span', { textContent: label }),
    h('div', { className: 'bar' }, h('i', { style: `width:${pct(p)}%` })),
    h('span', { className: 'pct', textContent: `${pct(p)}%` }));

  const renderAnswer = (q, a) => {
    if (a.type === 'boolean') {
      const yes = a.probability >= 0.5;
      return [
        h('p', { className: `verdict ${yes ? 'yes' : 'no'}`, textContent: `${yes ? t().yes : t().no} · ${t().sure(pct(yes ? a.probability : 1 - a.probability))}` }),
        bar(t().yes, a.probability, yes),
        bar(t().no, 1 - a.probability, !yes),
      ];
    }
    if (a.type === 'choice') {
      const probs = Object.entries(a.probabilities ?? { [a.choice]: 1 }).sort((x, y) => y[1] - x[1]);
      return [h('p', { className: 'verdict', textContent: a.choice }), probs.map(([k, p]) => bar(k, p, k === a.choice))];
    }
    const levels = q.criteria;
    const nearest = Math.min(levels.length - 1, Math.max(0, Math.round(a.score)));
    return [
      h('p', { className: 'verdict', textContent: `${levels[nearest]} · ${nearest + 1}/${levels.length}` }),
      levels.map((name, j) => bar(name, a.probabilities?.[j] ?? (j === nearest ? 1 : 0), j === nearest)),
    ];
  };

  const renderResults = () => {
    $('results-title').hidden = !lastRun;
    $('req').textContent = lastRun ? JSON.stringify(lastRun.req, null, 2) : '';
    $('res').textContent = lastRun ? JSON.stringify(lastRun.res, null, 2) : '';
    if (!lastRun) return $('results').replaceChildren();
    const { req, res } = lastRun;
    if (res.error) {
      return $('results').replaceChildren(h('div', { className: 'card fail' }, res.local ? null : h('strong', { textContent: t().errServer }), h('p', { textContent: res.error })));
    }
    $('results').replaceChildren(
      ...Object.entries(req.questions).map(([id, q]) => h('div', { className: 'card answer' },
        h('h3', { textContent: q.instructions }),
        res.answers?.[id] ? renderAnswer(q, res.answers[id]) : null)),
      h('p', { className: 'meta', textContent: t().meta(res.ms, res.usage?.totalTokens ?? '?') }),
    );
  };

  const renderDocs = () => {
    const docs = docsFor(lang);
    const section = (d) => h('details', { className: 'card doc', id: `doc-${d.id}`, open: true },
      h('summary', { textContent: d.title }),
      h('div', { className: 'doc-body' },
        (d.lead ?? []).map((p) => h('p', { textContent: p })),
        d.list ? h('ul', {}, d.list.map((li) => h('li', { textContent: li }))) : null,
        (d.code ?? []).map((src) => h('div', { className: 'code' },
          h('button', { textContent: t().copy, onclick: async (e) => {
            try { await navigator.clipboard.writeText(src); e.target.textContent = t().copied; setTimeout(() => (e.target.textContent = t().copy), 1500); } catch {}
          } }),
          h('pre', { textContent: src }))),
        d.table ? h('div', { className: 'table-wrap' }, h('table', {},
          h('thead', {}, h('tr', {}, d.table.head.map((c) => h('th', { textContent: c })))),
          h('tbody', {}, d.table.rows.map((r) => h('tr', {}, r.map((c) => h('td', { textContent: c }))))))) : null,
        (d.body ?? []).map((p) => h('p', { textContent: p })),
      ));
    $('view-docs').replaceChildren(
      h('p', { className: 'intro', textContent: t().docsIntro }),
      h('nav', { className: 'toc' }, h('span', { className: 'hint', textContent: t().docsToc }), docs.map((d) => h('a', { href: `#doc-${d.id}`, textContent: d.title }))),
      ...docs.map(section),
      h('button', { className: 'cta', textContent: t().tryIt, onclick: () => { setTab('playground'); scrollTo(0, 0); } }),
    );
  };

  const CONCURRENCY = 5;
  const challenge = { qid: 'team', text: QUESTIONS.team.instructions, rows: [], running: false, threshold: 0.5 };
  let rowEls = [];
  const resetRows = () => { challenge.rows = TICKETS.map((tk) => ({ id: tk.id, status: 'idle', expected: tk.expected[challenge.qid] })); };
  resetRows();

  const answerLabel = (value) => {
    if (value == null) return '';
    return QUESTIONS[challenge.qid].type === 'boolean' ? (value ? t().yes : t().no) : String(value);
  };
  const percent = (p) => (p == null ? '—' : new Intl.NumberFormat(t().locale, { style: 'percent', maximumFractionDigits: 0 }).format(p));

  const countUp = (el, target, total) => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = `${target}/${total}`; return; }
    const start = performance.now();
    const tick = (now) => {
      const p = Math.min(1, (now - start) / 700);
      el.textContent = `${Math.round((1 - (1 - p) ** 3) * target)}/${total}`;
      if (p < 1) requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  };

  const paintRow = (i) => {
    const row = challenge.rows[i];
    const el = rowEls[i];
    if (!el) return;
    const done = row.status === 'done';
    const settled = done || row.status === 'error';
    el.expected.textContent = answerLabel(row.expected);
    el.tr.className = done && !row.ok ? 'fail' : '';
    for (const td of [el.jev, el.conf, el.result]) td.className = row.status === 'pending' ? 'pending' : settled ? 'arrived' : '';
    el.conf.classList.add('num');
    el.jev.textContent = done ? answerLabel(row.answer) : row.status === 'pending' ? '…' : '';
    el.conf.textContent = done ? percent(row.confidence) : '';
    const result = done
      ? [h('span', { className: `badge ${row.ok ? 'ok' : 'bad'}`, textContent: row.ok ? t().badgeOk : t().badgeFail }),
        ...((row.confidence ?? 0) < challenge.threshold ? [' ', h('span', { className: 'badge warn', textContent: t().badgeReview })] : [])]
      : row.status === 'error'
        ? [h('span', { className: 'badge bad', textContent: t().errRowFailed }), ' ', h('button', { className: 'link', type: 'button', textContent: t().retry, disabled: challenge.running, onclick: () => retry(i) })]
        : [];
    el.result.replaceChildren(...result);
  };

  const paintProgress = () => {
    const btn = $('ch-run');
    if (!btn) return;
    const s = summarize(challenge.rows);
    const ready = canRun(challenge.text);
    $('ch-empty').hidden = ready;
    btn.disabled = !ready || challenge.running;
    btn.setAttribute('aria-busy', String(challenge.running));
    btn.textContent = challenge.running ? t().challengeProgress(s.answered + s.errors, s.total) : t().challengeRun(s.total);
    $('ch-score').hidden = !challenge.running && s.answered === 0;
    $('ch-score-num').textContent = challenge.running ? `—/${s.total}` : `${s.correct}/${s.answered}`;
    $('ch-errors').hidden = challenge.running || s.errors === 0 || s.answered === 0;
    $('ch-errors').textContent = t().challengeErrorsNote(s.errors);
    $('ch-all-failed').hidden = challenge.running || s.errors === 0 || s.answered > 0;
    paintThreshold(s);
    return s;
  };

  const paintThreshold = (s = summarize(challenge.rows)) => {
    const box = $('ch-threshold');
    if (!box) return;
    box.hidden = challenge.running || s.answered === 0;
    const b = bucket(challenge.rows, challenge.threshold);
    $('ch-th-value').textContent = new Intl.NumberFormat(t().locale, { minimumFractionDigits: 2 }).format(challenge.threshold);
    $('ch-auto').textContent = b.auto;
    $('ch-review').textContent = b.review;
    $('ch-wrong').textContent = b.wrongAuto;
  };

  const askOne = async (i) => {
    const qid = challenge.qid;
    const { trap, ...question } = QUESTIONS[qid];
    const ticket = TICKETS[i];
    challenge.rows[i] = { id: ticket.id, status: 'pending', expected: ticket.expected[qid] };
    paintRow(i);
    paintProgress();
    try {
      const r = await fetch('/evaluate', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ state: ticket.text, questions: { [qid]: { ...question, instructions: challenge.text.trim() } } }),
      });
      const body = await r.json();
      if (!r.ok || !body.answers?.[qid]) throw new Error(body.error || `HTTP ${r.status}`);
      challenge.rows[i] = { id: ticket.id, status: 'done', expected: ticket.expected[qid], ...judge(question, body.answers[qid], ticket.expected[qid], LEVELS[qid]) };
    } catch {
      challenge.rows[i] = { id: ticket.id, status: 'error', expected: ticket.expected[qid] };
    }
    paintRow(i);
    paintProgress();
  };

  const runChallenge = async () => {
    if (!canRun(challenge.text) || challenge.running) return;
    challenge.running = true;
    resetRows();
    renderChallenge();
    await pool(TICKETS, CONCURRENCY, (_, i) => askOne(i));
    challenge.running = false;
    renderChallenge();
    const s = summarize(challenge.rows);
    if (s.answered) countUp($('ch-score-num'), s.correct, s.answered);
  };

  const retry = async (i) => {
    await askOne(i);
    rowEls.forEach((_, k) => paintRow(k));
  };

  const renderChallenge = () => {
    const q = QUESTIONS[challenge.qid];
    const select = h('select', {
      id: 'ch-q',
      disabled: challenge.running,
      onchange: (e) => { challenge.qid = e.target.value; challenge.text = QUESTIONS[challenge.qid].instructions; resetRows(); renderChallenge(); },
    }, Object.entries(QUESTIONS).map(([id, qq]) => h('option', { value: id, textContent: qq.instructions, selected: id === challenge.qid })));
    const input = h('input', { id: 'ch-text', value: challenge.text, disabled: challenge.running, oninput: (e) => { challenge.text = e.target.value; paintProgress(); } });
    rowEls = TICKETS.map((tk) => {
      const cells = { expected: h('td'), jev: h('td'), conf: h('td'), result: h('td') };
      return { ...cells, tr: h('tr', {}, h('td', {}, h('span', { className: 'tid', textContent: tk.id }), tk.text), cells.expected, cells.jev, cells.conf, cells.result) };
    });
    $('view-challenge').replaceChildren(
      h('h2', { textContent: t().challengeTitle }),
      h('p', { className: 'intro', textContent: t().challengeIntro_plain }),
      h('div', { className: 'card' },
        h('div', { className: 'field' }, h('label', { htmlFor: 'ch-q', textContent: t().challengeSuggested }), select),
        h('div', { className: 'field' },
          h('label', { htmlFor: 'ch-text', textContent: t().challengeQuestion }),
          input,
          h('p', { id: 'ch-empty', className: 'error', textContent: t().errEmptyQuestion, hidden: true })),
        q.trap ? h('p', { className: 'hint', textContent: t().challengeTrapNote }) : null,
        h('button', { id: 'ch-run', className: 'primary', type: 'button', onclick: runChallenge }),
      ),
      h('div', { id: 'ch-score', className: 'scoreboard', hidden: true, ariaLive: 'polite' },
        h('span', { id: 'ch-score-num', className: 'score' }),
        h('span', { className: 'score-label', textContent: t().challengeScoreLabel })),
      h('div', { id: 'ch-threshold', className: 'card threshold', hidden: true },
        h('label', { htmlFor: 'ch-th', className: 'h-label', textContent: t().thresholdLabel }),
        h('div', { className: 'slider' },
          h('input', { id: 'ch-th', type: 'range', min: '0.5', max: '0.95', step: '0.05', value: String(challenge.threshold), oninput: (e) => {
            challenge.threshold = Number(e.target.value);
            paintThreshold();
            rowEls.forEach((_, i) => paintRow(i));
          } }),
          h('span', { id: 'ch-th-value', className: 'value', ariaLive: 'polite' })),
        h('div', { className: 'counters' },
          h('div', { className: 'counter auto' }, h('b', { id: 'ch-auto' }), h('span', { textContent: t().thresholdAuto })),
          h('div', { className: 'counter review' }, h('b', { id: 'ch-review' }), h('span', { textContent: t().thresholdReview })),
          h('div', { className: 'counter wrong' }, h('b', { id: 'ch-wrong' }), h('span', { textContent: t().thresholdWrongAuto }))),
        h('p', { className: 'hint', textContent: t().thresholdHelp_plain })),
      h('p', { id: 'ch-errors', className: 'hint', hidden: true }),
      h('div', { id: 'ch-all-failed', className: 'card fail', hidden: true, textContent: t().errAllFailed }),
      h('div', { className: 'table-wrap' }, h('table', { className: 'tickets' },
        h('thead', {}, h('tr', {}, [t().colTicket, t().colExpected, t().colJev, t().colConfidence, t().colResult].map((c) => h('th', { textContent: c })))),
        h('tbody', {}, rowEls.map((r) => r.tr)))),
    );
    rowEls.forEach((_, i) => paintRow(i));
    paintProgress();
  };

  const setTab = (tab) => {
    for (const name of ['challenge', 'playground', 'docs']) {
      $(`view-${name}`).hidden = name !== tab;
      $(`tab-${name}`).setAttribute('aria-selected', String(name === tab));
    }
    try { localStorage.setItem('tab', tab); } catch {}
  };

  document.querySelectorAll('[data-tab]').forEach((b) => (b.onclick = () => setTab(b.dataset.tab)));

  const setLang = (next) => {
    lang = next;
    document.documentElement.lang = lang;
    $('lang').value = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => (el.textContent = t()[el.dataset.i18n]));
    $('state').placeholder = t().statePlaceholder;
    renderExamples();
    renderDocs();
    renderChallenge();
    if (!dirty && preset) loadPreset(preset);
    else { renderQuestions(); renderResults(); }
    try { localStorage.setItem('lang', lang); } catch {}
  };

  $('state').oninput = touch;
  $('lang').onchange = (e) => setLang(e.target.value);
  $('add-q').onclick = () => { touch(); questions.push(blank()); renderQuestions(); };

  $('run').onclick = async () => {
    const req = toRequest();
    const errors = validate();
    if (!req.state || !questions.length || Object.keys(errors).length) {
      renderQuestions(errors);
      lastRun = { req, res: { local: true, error: !req.state ? t().errNoState : !questions.length ? t().errNoQuestions : Object.values(errors)[0] } };
      return renderResults();
    }
    renderQuestions();
    $('run').disabled = true;
    $('run').textContent = t().running;
    try {
      const r = await fetch('/evaluate', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(req) });
      lastRun = { req, res: await r.json() };
    } catch (error) {
      lastRun = { req, res: { error: error.message } };
    }
    $('run').disabled = false;
    $('run').textContent = t().run;
    renderResults();
    $('results-title').scrollIntoView({ behavior: 'smooth' });
  };

  let saved = null;
  let savedTab = null;
  try { saved = localStorage.getItem('lang'); savedTab = localStorage.getItem('tab'); } catch {}
  setLang(I18N[saved] ? saved : navigator.language.startsWith('es') ? 'es' : 'en');
  setTab(['playground', 'docs'].includes(savedTab) ? savedTab : 'challenge');
</script>
</body>
</html>
