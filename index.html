<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev Playground</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
  label { display: block; font-weight: 600; margin: 1rem 0 .3rem; }
  textarea, pre { width: 100%; box-sizing: border-box; font: 13px/1.4 ui-monospace, monospace; }
  textarea { padding: .5rem; }
  pre { padding: .75rem; background: #8881; border-radius: 6px; overflow: auto; min-height: 4rem; }
  button { margin-top: 1rem; padding: .5rem 1.5rem; font-size: 1rem; cursor: pointer; }
  select { font-size: 1rem; padding: .25rem; }
</style>
</head>
<body>
<header>
  <h1>Jev Playground</h1>
  <select id="lang" aria-label="Idioma / Language">
    <option value="es">Español</option>
    <option value="en">English</option>
  </select>
</header>

<label for="state" data-i18n="state"></label>
<textarea id="state" rows="4"></textarea>

<label for="questions" data-i18n="questions"></label>
<textarea id="questions" rows="18"></textarea>

<button id="run" data-i18n="run"></button>

<label data-i18n="result"></label>
<pre id="out"></pre>

<script>
  const I18N = {
    es: {
      state: 'State (texto o JSON)',
      questions: 'Preguntas (JSON)',
      run: 'Evaluar',
      result: 'Resultado',
      exampleState: 'El cliente mandó tres mails enojado por una entrega demorada. El agente de soporte pidió disculpas y le devolvió todo el dinero.',
      exampleQuestions: {
        refunded: { type: 'boolean', instructions: '¿Se hizo un reembolso?' },
        topic: {
          type: 'choice',
          instructions: '¿Cuál es el tema principal del ticket?',
          criteria: {
            envio: 'Problemas de entrega o logística',
            facturacion: 'Cobros, facturas o pagos',
            producto: 'Defectos o consultas del producto',
          },
        },
        anger: {
          type: 'score',
          instructions: '¿Qué tan enojado está el cliente?',
          criteria: ['tranquilo', 'molesto', 'enojado', 'furioso'],
        },
      },
    },
    en: {
      state: 'State (text or JSON)',
      questions: 'Questions (JSON)',
      run: 'Evaluate',
      result: 'Result',
      exampleState: 'The customer wrote three angry emails about a late delivery. The support agent apologized and issued a full refund.',
      exampleQuestions: {
        refunded: { type: 'boolean', instructions: 'Was a refund issued?' },
        topic: {
          type: 'choice',
          instructions: 'What is the main topic of the ticket?',
          criteria: {
            shipping: 'Delivery or logistics problems',
            billing: 'Charges, invoices or payments',
            product: 'Defects or product questions',
          },
        },
        anger: {
          type: 'score',
          instructions: 'How angry is the customer?',
          criteria: ['calm', 'annoyed', 'angry', 'furious'],
        },
      },
    },
  };

  const $ = (id) => document.getElementById(id);
  const examples = (lang) => ({
    state: I18N[lang].exampleState,
    questions: JSON.stringify(I18N[lang].exampleQuestions, null, 2),
  });
  const isExample = (field) => Object.keys(I18N).some((l) => examples(l)[field] === $(field).value);

  const setLang = (lang) => {
    document.documentElement.lang = lang;
    $('lang').value = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => (el.textContent = I18N[lang][el.dataset.i18n]));
    for (const field of ['state', 'questions']) {
      if (!$(field).value || isExample(field)) $(field).value = examples(lang)[field];
    }
    try { localStorage.setItem('lang', lang); } catch {}
  };

  let saved = null;
  try { saved = localStorage.getItem('lang'); } catch {}
  setLang(I18N[saved] ? saved : navigator.language.startsWith('es') ? 'es' : 'en');
  $('lang').onchange = (e) => setLang(e.target.value);

  $('run').onclick = async () => {
    const out = $('out');
    out.textContent = '...';
    try {
      const raw = $('state').value.trim();
      let state = raw;
      try { state = JSON.parse(raw); } catch {}
      const questions = JSON.parse($('questions').value);
      const res = await fetch('/evaluate', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ state, questions }),
      });
      out.textContent = JSON.stringify(await res.json(), null, 2);
    } catch (error) {
      out.textContent = error.message;
    }
  };
</script>
</body>
</html>
